# (RFC §4.1). Authors update their listing with an ordinary commit; camp
# ingests and hash-pins it at each tagged release. Listing for local_kopere_trail.

name: "kopere_trail"
summary: "Create and manage learning trails across Moodle courses, activities and content."
description: |
  Kopere Trail organizes Moodle courses, activities, external links, inline
  HTML and H5P into learning paths with prerequisites, completion criteria,
  progress tracking, personalization and micro-certificates.

  Moodle 4.4 or later is required by version.php. The plugin targets
  Moodle 4.5 LTS and the Moodle 5.x series.

labels:
  - fully-free
category: "learning"
links:
